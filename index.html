<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRide - Covoiturage Écologique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">ECORIDE</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="index.html">Accueil</a>
                <a class="nav-link" href="covoiturages.html">Covoiturages</a>
                <a class="nav-link" href="connexion.html">Connexion</a>
                <a class="nav-link" href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="text-center py-5 bg-light rounded">
            <h1 class="text-success">Roulez vert avec EcoRide</h1>
            <p>La plateforme de covoiturage éco-responsable pour réduire notre empreinte carbone.</p>
        </div>

        <div class="my-5 p-4 bg-white border rounded">
            <h3 class="mb-3">Rechercher un trajet</h3>
            <form class="row g-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Ville de départ" required>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" placeholder="Ville d'arrivée" required>
                </div>
                <div class="col-md-3">
                    <input type="date" class="form-control" required>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-success w-100">Go</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p>Contact : contact@ecoride.fr</p>
            <a href="mentions-legales.html" class="text-muted text-decoration-none">Mentions légales</a>
        </div>
    </footer>

</body>
</html>
